<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Café 11 Caixas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f0ea;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 85px);
            gap: 12px;
            width: 95vw;
            max-width: 500px;
            background-color: #dfd7cc;
            padding: 14px;
            border-radius: 16px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ddb892;
            border: 2px solid #b08968;
            font-size: 1.8rem;
            font-weight: bold;
            color: #7f5539;
            border-radius: 12px;
        }

        .highlight-item {
            background-color: #7f5539;
            border-color: #6c584c;
            color: #ede0d4;
        }

        .box-1 {
            grid-column: 1 / span 2;
            grid-row: 1 / span 2;
        }

        .box-2 { grid-column: 3; grid-row: 1; }
        .box-3 { grid-column: 4; grid-row: 1; }
        .box-4 { grid-column: 3; grid-row: 2; }
        .box-5 { grid-column: 4; grid-row: 2; }

        .box-6 {
            grid-column: 1;
            grid-row: 3 / span 2;
        }

        .box-7 { grid-column: 2; grid-row: 3; }
        .box-8 { grid-column: 3; grid-row: 3; }
        
        .box-9 { grid-column: 2; grid-row: 4; }
        .box-10 { grid-column: 3; grid-row: 4; }

        .box-11 {
            grid-column: 4;
            grid-row: 3 / span 2;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item box-1 highlight-item">1</div>
        <div class="grid-item box-2">2</div>
        <div class="grid-item box-3">3</div>
        <div class="grid-item box-4">4</div>
        <div class="grid-item box-5">5</div>
        <div class="grid-item box-6">6</div>
        <div class="grid-item box-7">7</div>
        <div class="grid-item box-8">8</div>
        <div class="grid-item box-9">9</div>
        <div class="grid-item box-10">10</div>
        <div class="grid-item box-11">11</div>
    </div>

</body>
</html>
