<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Cyan 7 Caixas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0c10;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 85px);
            gap: 12px;
            width: 95vw;
            max-width: 500px;
            background-color: #1f2833;
            padding: 14px;
            border-radius: 16px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #45f3ff;
            border: 2px solid #00b4cc;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0b0c10;
            border-radius: 12px;
        }

        .large-item {
            background-color: #a100ff;
            border-color: #7a00cc;
            color: #fff;
        }

        .box-1 { grid-column: 1; grid-row: 1; }
        .box-2 { grid-column: 1; grid-row: 2; }
        .box-3 { grid-column: 1; grid-row: 3; }
        .box-4 { grid-column: 1; grid-row: 4; }

        .box-5 { 
            grid-column: 2; 
            grid-row: 1 / span 2; 
        }
        
        .box-6 { grid-column: 2; grid-row: 3; }
        .box-7 { grid-column: 2; grid-row: 4; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item box-1">1</div>
        <div class="grid-item box-2">2</div>
        <div class="grid-item box-3">3</div>
        <div class="grid-item box-4">4</div>
        <div class="grid-item box-5 large-item">5</div>
        <div class="grid-item box-6">6</div>
        <div class="grid-item box-7">7</div>
    </div>

</body>
</html>
