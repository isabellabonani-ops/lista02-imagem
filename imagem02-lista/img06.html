<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Menta 8 Caixas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2f3e46;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 110px);
            gap: 12px;
            width: 95vw;
            max-width: 500px;
            background-color: #354f52;
            padding: 14px;
            border-radius: 16px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #cad2c5;
            border: 2px solid #84a98c;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2f3e46;
            border-radius: 12px;
        }

        .wide-item {
            background-color: #52796f;
            border-color: #354f52;
            color: #fff;
        }

        .box-1 { grid-column: 1; grid-row: 1; }
        .box-2 { grid-column: 2; grid-row: 1; }
        .box-3 { grid-column: 3; grid-row: 1; }

        .box-4 { grid-column: 1; grid-row: 2; }
        .box-5 { grid-column: 2; grid-row: 2; }
        .box-6 { grid-column: 3; grid-row: 2; }

        .box-7 { 
            grid-column: 1 / span 2; 
            grid-row: 3; 
        }
        
        .box-8 { grid-column: 3; grid-row: 3; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item box-1">1</div>
        <div class="grid-item box-2">2</div>
        <div class="grid-item box-3">3</div>
        <div class="grid-item box-4">4</div>
        <div class="grid-item box-5">5</div>
        <div class="grid-item box-6">6</div>
        <div class="grid-item box-7 wide-item">7</div>
        <div class="grid-item box-8">8</div>
    </div>

</body>
</html>
